
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Registration Form</title>
</head>

<body>

    <h1>College Admission Registration Form</h1>

    <p>Please fill in the following details to apply for college admission.</p>

    <form>

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname"
                placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"
                placeholder="Enter your email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"
                placeholder="Enter your phone number"
                pattern="[0-9]{10}" required>
            <br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required>
            <br><br>

            <label for="password">Create Password:</label><br>
            <input type="password" id="password" name="password"
                minlength="8" placeholder="Minimum 8 characters"
                required>
            <br><br>

            <label>Gender:</label><br>

            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <!-- Academic Information -->
        <fieldset>
            <legend>Academic Information</legend>

            <label for="qualification">Previous Qualification:</label><br>

            <select id="qualification" name="qualification" required>
                <option value="">Select Qualification</option>
                <option value="10th">10th Pass</option>
                <option value="12th">12th Pass</option>
                <option value="Diploma">Diploma</option>
                <option value="Graduation">Graduation</option>
            </select>

            <br><br>

            <label for="percentage">Previous Exam Percentage:</label><br>
            <input type="number" id="percentage" name="percentage"
                min="0" max="100" placeholder="Enter percentage"
                required>

        </fieldset>

        <br>

        <!-- Course Preferences -->
        <fieldset>
            <legend>Course Preferences</legend>

            <label for="course">Select Course:</label><br>

            <select id="course" name="course" required>
                <option value="">Select a Course</option>
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="B.Tech AI/ML">B.Tech AI/ML</option>
                <option value="BBA">BBA</option>
                <option value="BCA">BCA</option>
            </select>

            <br><br>

            <label>Interests:</label><br>

            <input type="checkbox" id="coding" name="interests"
                value="Coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="sports" name="interests"
                value="Sports">
            <label for="sports">Sports</label>

            <input type="checkbox" id="music" name="interests"
                value="Music">
            <label for="music">Music</label>

            <input type="checkbox" id="reading" name="interests"
                value="Reading">
            <label for="reading">Reading</label>

            <br><br>

            <label for="address">Full Address:</label><br>

            <textarea id="address" name="address"
                    rows="4" cols="40"
                    placeholder="Enter your full address"
                    required></textarea>

        </fieldset>

        <br>

        <!-- Documents -->
        <fieldset>
            <legend>Upload Documents</legend>

            <label for="photo">Upload Photograph:</label><br>
            <input type="file" id="photo" name="photo"
                accept="image/*" required>

            <br><br>

            <label for="documents">Upload Supporting Documents:</label><br>
            <input type="file" id="documents" name="documents"
                accept=".pdf,.jpg,.jpeg,.png" multiple required>

        </fieldset>

        <br>

        <!-- Declaration -->
        <fieldset>
            <legend>Declaration</legend>

            <input type="checkbox" id="declaration"
                name="declaration" required>

            <label for="declaration">
                I declare that all the information provided
                above is correct.
            </label>

        </fieldset>

        <br>

        <!-- Buttons -->
        <button type="submit">Submit Application</button>

        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
